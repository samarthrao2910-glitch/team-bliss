<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BROMITE — Brutalist AI Machine</title>
<meta name="description" content="Bromite — a neo-brutalist AI chatbot powered by Puter's free AI API.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/vs2015.min.css">
<style>
:root{
  color-scheme:light;
  --cream:#FFFDF5;
  --ink:#000000;
  --red:#FF6B6B;
  --yellow:#FFD93D;
  --violet:#C4B5FD;
  --white:#FFFFFF;
  --shadow:#000000;
  --graph-line:rgba(0,0,0,.06);
  --hint:rgba(0,0,0,.75);
  --input-bg:#FFFFFF;
  --font:'Space Grotesk',sans-serif;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --cream:#12151A;
  --ink:#EDEAE1;
  --red:#FF6B6B;
  --yellow:#FFD93D;
  --violet:#B9A7FF;
  --white:#1B1F26;
  --shadow:rgba(0,0,0,.85);
  --graph-line:rgba(255,255,255,.07);
  --hint:rgba(255,255,255,.62);
  --input-bg:#14171C;
}
html[data-accent="sunset"]{--red:#FF7A59;--yellow:#FFB03A;--violet:#F48FB1;}
html[data-accent="ocean"]{--red:#4ECDC4;--yellow:#45B7D1;--violet:#5E60CE;}
html[data-accent="forest"]{--red:#6BCB77;--yellow:#E9C46A;--violet:#9B8CFF;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:var(--font);
  background:var(--cream);
  color:var(--ink);
  font-weight:700;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
::selection{background:var(--ink);color:var(--cream);}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;}

.nb-graph{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-size:44px 44px;
  background-image:
    linear-gradient(to right, var(--graph-line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--graph-line) 1px, transparent 1px);
}
.nb-halftone{
  background-image:radial-gradient(rgba(0,0,0,.12) 1.5px, transparent 1.5px);
  background-size:18px 18px;
}
.nb-halftone-red{background-image:radial-gradient(rgba(0,0,0,.18) 1.5px, transparent 1.5px);background-size:16px 16px;}

.nb-b4{border:4px solid var(--ink);}
.nb-b2{border:2px solid var(--ink);}
.nb-shadow-sm{box-shadow:4px 4px 0 0 var(--shadow);}
.nb-shadow{box-shadow:8px 8px 0 0 var(--shadow);}
.nb-shadow-lg{box-shadow:12px 12px 0 0 var(--shadow);}
.nb-shadow-xl{box-shadow:16px 16px 0 0 var(--shadow);}
.nb-shadow-white{box-shadow:8px 8px 0 0 var(--white);}

.text-outline{
  color:transparent;
  -webkit-text-stroke:2px var(--ink);
  paint-order:stroke fill;
}
.text-outline-white{
  color:transparent;
  -webkit-text-stroke:2px var(--white);
}

.nb-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  border:4px solid var(--ink);
  font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;
  padding:.8rem 1.2rem;background:var(--white);
  box-shadow:4px 4px 0 0 var(--shadow);
  transition:transform .1s ease-linear, box-shadow .1s ease-linear, background .1s ease-linear;
  user-select:none;
  min-height:44px;
}
.nb-btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 0 var(--shadow);}
.nb-btn:active{transform:translate(4px,4px);box-shadow:0 0 0 0 var(--shadow);}
.nb-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 0 var(--shadow);}
.nb-btn-red{background:var(--red);}
.nb-btn-yellow{background:var(--yellow);}
.nb-btn-violet{background:var(--violet);}
.nb-btn-black{background:var(--ink);color:var(--white);}
.nb-btn-black:active{box-shadow:0 0 0 0 var(--white);}

/* ---------- LAYOUT ---------- */
#app{
  position:relative;z-index:1;
  display:flex;flex-direction:column;height:100dvh;
}

/* HEADER */
.nb-header{
  display:flex;align-items:center;gap:.75rem;
  border-bottom:4px solid var(--ink);
  background:var(--cream);
  padding:.6rem 1rem;
  flex:none;
  position:relative;z-index:20;
}
.nb-logo{
  display:flex;align-items:center;gap:.5rem;
  border:4px solid var(--ink);background:var(--yellow);
  padding:.35rem .75rem;box-shadow:4px 4px 0 0 var(--shadow);
  transform:rotate(-1deg);
  flex:none;
}
.nb-logo .star{color:var(--ink);}
.nb-logo b{font-weight:900;font-size:1.05rem;letter-spacing:.02em;line-height:1;}
.nb-header-title{
  font-weight:900;text-transform:uppercase;font-size:.85rem;letter-spacing:.08em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0;
}
.nb-header-model{
  display:flex;align-items:center;gap:.4rem;
  border:4px solid var(--ink);background:var(--violet);
  font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;
  padding:.5rem .7rem;box-shadow:4px 4px 0 0 var(--shadow);
  cursor:pointer;transition:transform .1s ease-linear;
  flex:none;max-width:210px;
}
.nb-header-model:hover{transform:translateY(-2px);}
.nb-header-model .mname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:48px;height:48px;flex:none;
  border:4px solid var(--ink);background:var(--white);
  box-shadow:4px 4px 0 0 var(--shadow);
  transition:transform .1s ease-linear, box-shadow .1s ease-linear, background .1s ease-linear;
}
.icon-btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 0 var(--shadow);background:var(--yellow);}
.icon-btn:active{transform:translate(4px,4px);box-shadow:0 0 0 0 var(--shadow);}

/* SHELL */
.nb-shell{display:flex;flex:1 1 auto;min-height:0;position:relative;}

/* SIDEBAR */
.nb-sidebar{
  width:300px;flex:none;
  border-right:4px solid var(--ink);
  background:var(--cream);
  display:flex;flex-direction:column;
  position:relative;z-index:30;
  transition:width .18s ease-out, border .18s ease-out;
}
.nb-sidebar.collapsed{width:0;overflow:hidden;border-right-width:0;}
.nb-sidebar-head{
  padding:.9rem;display:flex;gap:.5rem;
  border-bottom:4px solid var(--ink);
}
.nb-sidebar-head .nb-btn{flex:1;}
.nb-sidebar-search{
  padding:.75rem .9rem;border-bottom:4px solid var(--ink);
}
.search-box{
  display:flex;align-items:center;gap:.5rem;
  border:4px solid var(--ink);background:var(--white);
  padding:.5rem .75rem;
}
.search-box svg{flex:none;}
.search-box input{
  border:none;outline:none;background:transparent;width:100%;
  font-weight:700;font-size:.95rem;
}
.conv-list{flex:1 1 auto;overflow-y:auto;padding:.75rem .6rem;display:flex;flex-direction:column;gap:.5rem;}
.conv-item{
  width:100%;text-align:left;
  display:flex;align-items:center;gap:.5rem;
  border:4px solid var(--ink);background:var(--white);
  padding:.6rem .75rem;box-shadow:4px 4px 0 0 var(--shadow);
  transition:transform .1s ease-linear, box-shadow .1s ease-linear, background .1s ease-linear;
}
.conv-item:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 0 var(--shadow);background:var(--cream);}
.conv-item.active{background:var(--violet);}
.conv-item .dot{width:10px;height:10px;flex:none;border:2px solid var(--ink);background:var(--cream);}
.conv-item.active .dot{background:var(--red);}
.conv-item .txt{flex:1 1 auto;min-width:0;font-weight:700;font-size:.82rem;line-height:1.25;}
.conv-item .txt .title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conv-item .txt .meta{display:block;font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;opacity:.6;font-weight:500;margin-top:2px;}
.conv-item .mini{
  width:30px;height:30px;flex:none;display:inline-flex;align-items:center;justify-content:center;
  border:2px solid var(--ink);background:var(--cream);opacity:0;transition:opacity .1s ease-linear;
}
.conv-item:hover .mini,.conv-item.active .mini{opacity:1;}
.conv-item .mini:hover{background:var(--red);}
.conv-rename-input{
  width:100%;border:2px solid var(--ink);background:var(--white);
  font-weight:700;font-size:.8rem;padding:.25rem .4rem;outline:none;
}
.nb-sidebar-foot{
  padding:.9rem;border-top:4px solid var(--ink);
  display:flex;gap:.5rem;
}
.nb-sidebar-foot .nb-btn{flex:1;}
.nb-sidebar-banner{
  margin:.4rem .9rem .9rem;
  border:4px solid var(--ink);background:var(--red);
  padding:.6rem .8rem;transform:rotate(-1deg);
  box-shadow:6px 6px 0 0 var(--shadow);
}
.nb-sidebar-banner b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;line-height:1.4;}

/* MAIN */
.nb-main{
  flex:1 1 auto;min-width:0;
  display:flex;flex-direction:column;min-height:0;position:relative;
}
.nb-msgs{
  flex:1 1 auto;overflow-y:auto;
  padding:1.2rem 1rem 1rem;
  display:flex;flex-direction:column;gap:1.4rem;
  scroll-behavior:auto;
}
.nb-msgs-inner{width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:1.4rem;}

/* MESSAGES */
.msg{display:flex;flex-direction:column;gap:.4rem;animation:msgIn .18s ease-out;content-visibility:auto;contain-intrinsic-size:auto 120px;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.msg-user{align-items:flex-end;}
.msg-assistant{align-items:flex-start;}
.msg-row{max-width:100%;}
.msg-user .msg-row{max-width:88%;}
.msg-assistant .msg-row{width:100%;}

.role-chip{
  display:inline-flex;align-items:center;gap:.35rem;
  border:4px solid var(--ink);
  font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.14em;
  padding:.3rem .7rem;box-shadow:3px 3px 0 0 var(--shadow);
  transform:rotate(-1deg);
}
.role-chip.user{background:var(--red);align-self:flex-end;}
.role-chip.ai{background:var(--violet);}

.msg-body{
  border:4px solid var(--ink);
  padding:1rem 1.15rem;
  font-size:1rem;line-height:1.7;font-weight:500;
  word-wrap:break-word;overflow-wrap:anywhere;
}
.msg-user .msg-body{
  background:var(--red);
  box-shadow:8px 8px 0 0 var(--shadow);
  font-weight:700;
}
.msg-assistant .msg-body{
  background:var(--white);
  box-shadow:8px 8px 0 0 var(--shadow);
}
.msg-body p{margin:.4em 0;}
.msg-body p:first-child{margin-top:0;}
.msg-body p:last-child{margin-bottom:0;}
.msg-body h1,.msg-body h2,.msg-body h3,.msg-body h4{
  font-weight:900;line-height:1.15;text-transform:uppercase;letter-spacing:.02em;margin:1em 0 .45em;
}
.msg-body h1{font-size:1.5rem;border-bottom:3px solid var(--ink);padding-bottom:.25em;}
.msg-body h2{font-size:1.25rem;}
.msg-body h3{font-size:1.1rem;}
.msg-body a{color:var(--ink);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px;}
.msg-body a:hover{background:var(--yellow);}
.msg-body ul,.msg-body ol{margin:.5em 0;padding-left:1.5em;display:flex;flex-direction:column;gap:.25em;}
.msg-body li::marker{font-weight:900;}
.msg-body ul li{list-style-type:'▸ ';}
.msg-body input[type=checkbox]{width:18px;height:18px;accent-color:var(--ink);margin-right:.4em;}
.msg-body blockquote{
  border:4px solid var(--ink);background:var(--violet);
  padding:.75rem 1rem;margin:.8em 0;box-shadow:4px 4px 0 0 var(--shadow);
}
.msg-body blockquote p:first-child{margin-top:0;} .msg-body blockquote p:last-child{margin-bottom:0;}
.msg-body hr{border:none;border-top:4px solid var(--ink);margin:1.2em 0;}
.msg-body code{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:.85em;}
.msg-body :not(pre)>code{
  background:var(--yellow);border:2px solid var(--ink);padding:.1em .35em;font-weight:700;
}
.msg-body pre{
  position:relative;
  border:4px solid var(--ink);
  background:#0f0f10;
  margin:.9em 0;
  overflow:hidden;
  box-shadow:6px 6px 0 0 var(--shadow);
}
.msg-body pre .code-head{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--ink);color:var(--white);
  border-bottom:4px solid var(--ink);
  padding:.35rem .8rem;
}
.msg-body pre .code-head .lang{font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.16em;}
.code-copy{
  display:inline-flex;align-items:center;gap:.35rem;
  border:2px solid var(--white);background:transparent;color:var(--white);
  font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;
  padding:.3rem .6rem;transition:background .1s ease-linear,color .1s ease-linear;
}
.code-copy:hover{background:var(--red);color:var(--ink);border-color:var(--ink);}
.msg-body pre code{
  display:block;overflow-x:auto;padding:1rem;font-size:.85rem;line-height:1.6;
  background:transparent !important;color:#e6e6e6;
}
.msg-body pre code.hljs{background:transparent !important;}
.msg-body .katex{font-size:1.05em;}
.msg-body table{
  border-collapse:collapse;margin:.9em 0;width:100%;font-size:.92rem;
  border:4px solid var(--ink);
}
.msg-body th,.msg-body td{border:2px solid var(--ink);padding:.5rem .8rem;text-align:left;}
.msg-body th{background:var(--yellow);font-weight:900;text-transform:uppercase;font-size:.72rem;letter-spacing:.08em;}
.msg-body tr:nth-child(even) td{background:var(--cream);}

.msg-actions{display:flex;gap:.5rem;align-items:center;}
.msg-actions button{
  display:inline-flex;align-items:center;gap:.35rem;
  border:3px solid var(--ink);background:var(--white);
  font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;
  padding:.35rem .7rem;box-shadow:3px 3px 0 0 var(--shadow);
  transition:transform .1s ease-linear, box-shadow .1s ease-linear, background .1s ease-linear;
  min-height:38px;
}
.msg-actions button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 0 var(--shadow);background:var(--yellow);}
.msg-actions button:active{transform:translate(3px,3px);box-shadow:none;}
.msg-actions button.done{background:var(--yellow);}
.research-src{display:flex;align-items:center;margin-top:.35rem;}
.research-src a{
  display:inline-flex;align-items:center;gap:.35rem;
  font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;
  color:var(--violet);border:2px solid var(--violet);background:var(--white);
  padding:.3rem .6rem;box-shadow:2px 2px 0 0 var(--shadow);text-decoration:none;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:transform .1s ease-linear, background .1s ease-linear;
}
.research-src a:hover{transform:translate(-1px,-1px);background:var(--yellow);}
.research-src a:active{transform:translate(2px,2px);box-shadow:none;}

.msg-error{
  border:4px solid var(--ink);background:var(--red);
  padding:.9rem 1rem;box-shadow:8px 8px 0 0 var(--shadow);
  display:flex;flex-direction:column;gap:.5rem;
}
.msg-error .err-label{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:.16em;margin-bottom:.2rem;}
.msg-error .err-text{font-weight:700;font-size:.95rem;line-height:1.5;word-break:break-word;}
.msg-error .nb-btn{align-self:flex-start;}

.cursor{
  display:inline-block;width:10px;height:1.15em;background:var(--ink);
  animation:blink 1s steps(2) infinite;vertical-align:text-bottom;
}
@keyframes blink{50%{opacity:0;}}

/* JUMP TO LATEST */
.jump-btn{
  position:absolute;bottom:0;right:1.4rem;
  transform:translateY(calc(100% + 0.8rem));
  opacity:0;pointer-events:none;
  transition:transform .15s ease-out, opacity .15s ease-out;
  z-index:15;
}
.jump-btn.show{transform:translateY(0);opacity:1;pointer-events:auto;}

/* COMPOSER */
.nb-composer-wrap{
  flex:none;
  border-top:4px solid var(--ink);
  background:var(--cream);
  padding:.9rem 1rem calc(.9rem + env(safe-area-inset-bottom));
  position:relative;
}
.nb-composer{max-width:820px;margin:0 auto;}
.composer-box{
  border:4px solid var(--ink);background:var(--white);
  box-shadow:8px 8px 0 0 var(--shadow);
  display:flex;align-items:flex-end;gap:.5rem;padding:.6rem;
  transition:box-shadow .1s ease-linear, transform .1s ease-linear;
}
.composer-box:focus-within{
  background:var(--yellow);
  box-shadow:4px 4px 0 0 var(--shadow);
}
#composer{
  flex:1 1 auto;min-width:0;
  border:none;outline:none;background:transparent;resize:none;
  font-weight:700;font-size:1rem;line-height:1.5;
  padding:.45rem .4rem;max-height:190px;
}
#composer::placeholder{color:rgba(0,0,0,.45);}
.send-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:56px;height:56px;flex:none;
  border:4px solid var(--ink);background:var(--red);
  box-shadow:4px 4px 0 0 var(--shadow);
  transition:transform .1s ease-linear, box-shadow .1s ease-linear, background .1s ease-linear;
}
.send-btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 0 var(--shadow);}
.send-btn:active{transform:translate(4px,4px);box-shadow:0 0 0 0 var(--shadow);}
.send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.send-btn.stop{background:var(--ink);color:var(--white);}
.composer-status{
  display:flex;justify-content:center;align-items:center;gap:.5rem;flex-wrap:nowrap;
  margin-top:.55rem;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;
  color:rgba(0,0,0,.5);min-width:0;
}
.composer-status #providerStatus{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90%;}
.stop-gen-btn{font-size:.62rem;padding:.3rem .6rem;margin-left:.4rem;font-family:'JetBrains Mono',Consolas,monospace;letter-spacing:.14em;position:relative;overflow:hidden;animation:retroBlink 1.2s steps(2,start) infinite;}
.stop-gen-btn::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 1px,transparent 1px 3px);}
@keyframes retroBlink{0%,100%{opacity:1;box-shadow:0 0 14px rgba(255,60,60,.85);}50%{opacity:.5;box-shadow:0 0 3px rgba(255,60,60,.35);}}
.action-btn.playing{background:var(--red) !important;color:#fff !important;animation:retroBlink 1.2s steps(2,start) infinite;}
.attach-btn.img-btn.mic-active{background:var(--red) !important;color:#fff !important;animation:micPulse 1.1s ease-in-out infinite;}
@keyframes micPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.55;transform:scale(.92);}}
html[data-theme="retro"] .attach-btn.img-btn.mic-active{background:#FF0000 !important;border-color:#FF8080 #800000 #800000 #FF8080 !important;}

/* EMPTY STATE */
.empty-state{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.4rem;padding:1.5rem 1rem 2.5rem;text-align:center;
  position:relative;
}
.empty-hero{position:relative;display:inline-block;}
.empty-hero h1{
  font-weight:900;font-size:clamp(3rem,9vw,5.5rem);line-height:.95;
  text-transform:uppercase;letter-spacing:-.02em;
}
.empty-hero .sticker{
  position:absolute;border:4px solid var(--ink);padding:.4rem .9rem;
  font-size:.75rem;font-weight:900;text-transform:uppercase;letter-spacing:.14em;
  box-shadow:4px 4px 0 0 var(--shadow);
}
.empty-hero .sticker.s1{top:-1.4rem;right:-2.5rem;background:var(--red);transform:rotate(6deg);}
.empty-hero .sticker.s2{bottom:-1.1rem;left:-3rem;background:var(--violet);transform:rotate(-5deg);}
.empty-sub{font-weight:500;font-size:1.05rem;max-width:46ch;line-height:1.6;color:var(--ink);}
.empty-prompts{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:1rem;width:100%;max-width:720px;
}
.prompt-card{
  border:4px solid var(--ink);padding:1.1rem .9rem;
  text-align:left;display:flex;flex-direction:column;gap:.6rem;
  font-family:inherit;box-shadow:8px 8px 0 0 var(--shadow);
  transition:transform .1s ease-linear, box-shadow .1s ease-linear;
  min-height:120px;
}
.prompt-card:hover{transform:translate(-2px,-2px) rotate(var(--r,0deg));box-shadow:12px 12px 0 0 var(--shadow);}
.prompt-card:active{transform:translate(6px,6px);box-shadow:none;}
.prompt-card .p-title{font-weight:900;text-transform:uppercase;font-size:1.05rem;letter-spacing:.02em;line-height:1.1;}
.prompt-card .p-desc{font-weight:500;font-size:.82rem;line-height:1.45;opacity:.85;}
.prompt-card .p-go{display:inline-flex;align-items:center;gap:.35rem;font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:.14em;margin-top:auto;}
.empty-deco{position:absolute;pointer-events:none;z-index:0;}
.star-spin{animation:spinSlow 12s linear infinite;}
@keyframes spinSlow{from{transform:rotate(0);}to{transform:rotate(360deg);}}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.55);
  display:none;align-items:center;justify-content:center;padding:1rem;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--cream);border:4px solid var(--ink);
  box-shadow:12px 12px 0 0 var(--shadow);
  width:100%;max-width:520px;max-height:90dvh;overflow-y:auto;
  animation:modalIn .16s ease-out;
}
@keyframes modalIn{from{opacity:0;transform:scale(.96) rotate(-1deg);}to{opacity:1;transform:none;}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  border-bottom:4px solid var(--ink);background:var(--yellow);
  padding:.9rem 1.1rem;
}
.modal-head b{font-weight:900;text-transform:uppercase;font-size:.95rem;letter-spacing:.05em;}
.modal-body{padding:1.2rem 1.1rem;display:flex;flex-direction:column;gap:1.1rem;max-height:calc(100vh - 160px);overflow-y:auto;}
.modal-foot{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;border-top:4px solid var(--ink);padding:.9rem 1.1rem;}

.field{display:flex;flex-direction:column;gap:.4rem;}
.field label{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:.14em;}
.field input,.field select,.field textarea{
  border:4px solid var(--ink);background:var(--white);
  font-weight:700;font-size:.95rem;padding:.65rem .8rem;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{background:var(--yellow);box-shadow:4px 4px 0 0 var(--shadow);}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 12px) 50%;background-size:8px 8px;background-repeat:no-repeat;padding-right:2.2rem;}
.range-row{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;font-weight:900;}
input[type=range]{appearance:none;width:100%;height:22px;background:transparent;border:4px solid var(--ink);padding:0;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{appearance:none;width:22px;height:22px;background:var(--red);border:3px solid var(--ink);box-shadow:2px 2px 0 0 var(--shadow);}
input[type=range]::-moz-range-thumb{width:22px;height:22px;background:var(--red);border:3px solid var(--ink);border-radius:0;box-shadow:2px 2px 0 0 var(--shadow);}
.nb-note{
  border:4px solid var(--ink);background:var(--red);
  padding:.7rem .9rem;font-weight:700;font-size:.78rem;line-height:1.5;
  box-shadow:4px 4px 0 0 var(--shadow);
}
.nb-note.violet{background:var(--violet);}

/* TOAST */
.nb-toast{
  position:fixed;bottom:1.2rem;left:50%;transform:translate(-50%,140%);
  z-index:200;background:var(--ink);color:var(--white);
  border:4px solid var(--white);box-shadow:6px 6px 0 0 var(--shadow);
  padding:.7rem 1.2rem;font-weight:900;font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;
  transition:transform .16s ease-out;
  max-width:90vw;text-align:center;
}
.nb-toast.show{transform:translate(-50%,0);}

/* SCROLLBARS */
::-webkit-scrollbar{width:14px;height:14px;}
::-webkit-scrollbar-track{background:var(--cream);border-left:2px solid var(--ink);}
::-webkit-scrollbar-thumb{background:var(--ink);border:3px solid var(--cream);}
::-webkit-scrollbar-thumb:hover{background:var(--red);}

.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

/* ---------- SYSTEM TERMINAL (CRT / TERMINAL CLI) ---------- */
.term-overlay{
  position:fixed;inset:0;z-index:9999;background:#0a0a0a;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
}
.term-overlay[hidden]{display:none;}
.term-scanlines{
  position:absolute;inset:0;pointer-events:none;opacity:.35;z-index:2;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
}
.term{
  position:relative;z-index:3;width:min(960px,calc(100vw - 2rem));height:min(620px,calc(100vh - 2rem));
  background:#0a0a0a;border:1px solid #1f521f;box-shadow:0 0 30px rgba(51,255,0,.12);
  display:flex;flex-direction:column;color:#33ff00;text-shadow:0 0 5px rgba(51,255,0,.5);
}
.term-head{
  display:flex;justify-content:space-between;align-items:center;gap:.5rem;
  border-bottom:1px solid #1f521f;padding:.5rem .8rem;font-size:.72rem;letter-spacing:.12em;
  background:linear-gradient(180deg,#0d0d0d,#0a0a0a);
}
.term-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.term-exit{
  background:#0a0a0a;color:#ffb000;border:1px solid #ffb000;font:inherit;font-size:.72rem;letter-spacing:.1em;
  padding:.35rem .7rem;cursor:pointer;text-transform:uppercase;
}
.term-exit:hover{background:#ffb000;color:#000;text-shadow:none;}
.term-body{
  flex:1;overflow-y:auto;padding:.9rem 1rem;font-size:.85rem;line-height:1.5;
  white-space:pre-wrap;word-break:break-word;
}
.term-body::-webkit-scrollbar{width:8px;}
.term-body::-webkit-scrollbar-thumb{background:#1f521f;}
.term-line{color:#33ff00;}
.term-line.dim{color:#1f521f;}
.term-line.warn{color:#ffb000;}
.term-line.err{color:#ff3333;text-shadow:0 0 5px rgba(255,51,51,.5);}
.term-line.user{color:#ffb000;}
.term-line.ai{color:#33ff00;border-left:2px solid #1f521f;padding-left:.6rem;margin:.25rem 0;}
.term-line.ok{color:#33ff00;}
.term-line.rain{color:rgba(51,255,0,.35);font-size:.65rem;line-height:1;text-shadow:none;}
.term-banner{color:#33ff00;font-size:.68rem;line-height:1.25;text-shadow:0 0 6px rgba(51,255,0,.55);}
.term-input-row{display:flex;align-items:center;gap:.4rem;border-top:1px solid #1f521f;padding:.55rem .9rem;background:#0d0d0d;}
.term-prompt{color:#ffb000;font-size:.85rem;white-space:nowrap;}
.term-input{
  flex:1;background:transparent;border:0;outline:0;color:#33ff00;font:inherit;font-size:.85rem;padding:0;
  caret-color:#33ff00;text-shadow:0 0 5px rgba(51,255,0,.5);
}
.term-cursor{
  width:9px;height:1.1em;background:#33ff00;flex:0 0 auto;
  animation:termBlink 1s steps(1) infinite;
}
@keyframes termBlink{50%{opacity:0;}}
@media (max-width:640px){
  .term{height:calc(100vh - 1rem);width:calc(100vw - 1rem);}
  .term-banner{font-size:.48rem;}
}

/* ---------- LIVE VOICE (GEMINI LIVE) ---------- */
.live-panel{
  position:fixed;top:84px;left:50%;transform:translateX(-50%);z-index:2500;
  width:min(860px,calc(100vw - 2rem));
  background:var(--paper);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--ink);
  display:flex;flex-direction:column;max-height:min(520px,calc(100vh - 140px));
}
.live-panel[hidden]{display:none;}
.live-head{
  display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem;
  background:var(--ink);color:var(--paper);font-weight:900;letter-spacing:.04em;font-size:.8rem;
}
.live-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.live-dot{width:12px;height:12px;background:#666;flex:0 0 auto;border-radius:50%;}
.live-dot.on{background:#0f0;box-shadow:0 0 8px #0f0;animation:livePulse 1.2s ease-in-out infinite;}
.live-dot.err{background:var(--red);}
@keyframes livePulse{50%{opacity:.45;}}
.live-head-status{font-size:.68rem;letter-spacing:.14em;opacity:.85;}
.live-x{
  background:transparent;border:2px solid var(--paper);color:var(--paper);font-weight:900;
  width:30px;height:30px;cursor:pointer;font-size:.9rem;line-height:1;
}
.live-x:hover{background:var(--red);border-color:var(--red);}
.live-meter{height:12px;background:var(--cream);border-bottom:3px solid var(--ink);overflow:hidden;}
.live-meter-fill{height:100%;width:0%;background:var(--yellow);transition:width .08s linear;}
.live-meter-fill.hot{background:var(--red);}
.live-log{
  flex:1;overflow-y:auto;padding:.6rem .8rem;min-height:90px;max-height:280px;
  font-family:'JetBrains Mono','Fira Code',Consolas,monospace;font-size:.8rem;line-height:1.6;
}
.live-log::-webkit-scrollbar{width:8px;}
.live-log::-webkit-scrollbar-thumb{background:var(--ink);}
.live-line{margin:.15rem 0;}
.live-line .who{font-weight:900;}
.live-line.you .who{color:var(--red);}
.live-line.bot .who{color:var(--green,var(--accent1));}
.live-line.sys{color:var(--hint);font-size:.72rem;letter-spacing:.08em;}
.live-line.err{color:var(--red);font-weight:700;}
.live-foot{
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  border-top:3px solid var(--ink);padding:.55rem .8rem;
}
.live-hint{font-size:.68rem;letter-spacing:.08em;color:var(--hint);font-weight:700;}
#liveBtn.live-active{background:var(--red) !important;color:#fff !important;animation:micPulse 1.1s ease-in-out infinite;}
html[data-theme="retro"] .live-panel{border:2px solid #000;box-shadow:4px 4px 0 #000;font-family:Tahoma,'MS Sans Serif',sans-serif;background:#FFFFCC;}
html[data-theme="retro"] .live-head{background:#000080;color:#fff;font-family:Tahoma,'MS Sans Serif',sans-serif;}
html[data-theme="retro"] .live-meter{background:#fff;border-bottom:1px solid #000;}
html[data-theme="retro"] .live-meter-fill{background:#FF0000;}
html[data-theme="retro"] .live-log{font-family:Tahoma,'MS Sans Serif',sans-serif;font-size:.78rem;}
html[data-theme="retro"] #liveBtn.live-active{background:#FF0000 !important;border-color:#FF8080 #800000 #800000 #FF8080 !important;color:#fff !important;}
@media (max-width:640px){
  .live-panel{top:64px;max-height:calc(100vh - 80px);}
  .live-title{font-size:.68rem;}
  .live-hint{display:none;}
}

/* HAND TRACKING */
.hand-panel{
  position:fixed;top:84px;right:18px;z-index:2600;
  width:230px;background:var(--paper);border:4px solid var(--ink);
  box-shadow:8px 8px 0 var(--shadow);transform:rotate(1.5deg);
  display:flex;flex-direction:column;overflow:hidden;
}
.hand-panel[hidden]{display:none;}
.hand-panel-head{
  display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;
  background:var(--ink);color:var(--paper);font-weight:900;
  font-size:.72rem;letter-spacing:.08em;cursor:grab;user-select:none;
}
.hand-panel-head:active{cursor:grabbing;}
.hand-panel-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hand-panel-status{font-size:.58rem;letter-spacing:.12em;opacity:.85;max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hand-panel-x{
  background:transparent;border:2px solid var(--paper);color:var(--paper);
  font-weight:900;width:24px;height:24px;cursor:pointer;font-size:.75rem;line-height:1;
}
.hand-panel-x:hover{background:var(--red);border-color:var(--red);}
.hand-video-wrap{position:relative;width:100%;aspect-ratio:4/3;background:#000;}
.hand-video-wrap video,.hand-video-wrap canvas{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
}
.hand-video-wrap video{transform:scaleX(-1);}
.hand-video-wrap canvas{pointer-events:none;}
.hand-panel-foot{
  padding:.35rem .6rem;font-size:.58rem;font-weight:900;letter-spacing:.1em;
  text-align:center;background:var(--yellow);color:#000;
}
#handModeBtn.hand-on{background:var(--yellow);color:#000;}
#handModeBtn.hand-on i{color:#000;}

.hand-cursor{
  position:fixed;top:0;left:0;z-index:3200;pointer-events:none;
  will-change:transform;
  transition:opacity .35s ease;
}
.hand-cursor[hidden]{display:none;}
.hand-cursor.gone{opacity:0;}
body.hand-mode, body.hand-mode *{cursor:none !important;}
.hand-cursor-ring{
  position:absolute;left:50%;top:50%;width:44px;height:44px;
  transform:translate(-50%,-50%);border:3px solid var(--red);
  border-radius:50%;box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink);
  transition:width .12s ease,height .12s ease;
}
.hand-cursor.down .hand-cursor-ring{width:30px;height:30px;background:var(--red);}
.hand-cursor-dot{
  position:absolute;left:50%;top:50%;width:8px;height:8px;
  transform:translate(-50%,-50%);background:var(--ink);border-radius:50%;
}
.hand-cursor-label{
  position:absolute;left:50%;top:calc(50% + 30px);transform:translateX(-50%);
  background:var(--ink);color:var(--paper);font-size:.6rem;font-weight:900;
  letter-spacing:.12em;padding:.15rem .5rem;white-space:nowrap;
  border:2px solid var(--ink);box-shadow:2px 2px 0 var(--shadow);
}
html[data-theme="retro"] .hand-panel{
  border:2px solid #000;box-shadow:4px 4px 0 #000;transform:none;
  background:#FFFFCC;font-family:Tahoma,'MS Sans Serif',sans-serif;
}
html[data-theme="retro"] .hand-panel-head{background:#000080;color:#fff;}
html[data-theme="retro"] .hand-panel-foot{background:#FFFF00;color:#000;}
html[data-theme="retro"] .hand-cursor-label{font-family:Tahoma,'MS Sans Serif',sans-serif;}
html[data-theme="retro"] .hand-cursor-ring{border-color:#FF0000;}
html[data-theme="retro"] .hand-cursor.down .hand-cursor-ring{background:#FF0000;}

/* ---------- 3D SIMULATION MODAL ---------- */
.sim-modal{
  position:fixed;inset:0;z-index:3000;display:flex;flex-direction:column;
  background:var(--paper,#fdfbf2);border:3px solid var(--ink);
  box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--ink);
}
.sim-modal[hidden]{display:none;}
.sim-head{
  display:flex;align-items:center;gap:.6rem;padding:.5rem .75rem;
  background:var(--ink);color:var(--paper);font-weight:900;letter-spacing:.08em;
}
.sim-title{font-size:.8rem;}
.sim-status{margin-left:auto;font-size:.62rem;color:var(--hint,#b8860b);}
.sim-x{
  background:none;border:none;color:var(--paper);font-size:1rem;cursor:pointer;padding:.2rem .4rem;
}
.sim-promptbar{
  display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;
  border-bottom:3px solid var(--ink);background:var(--paper,#fdfbf2);
}
.sim-input{
  flex:1;min-width:0;padding:.5rem .7rem;font-size:.85rem;color:var(--ink);
  background:var(--paper,#fff);border:2px solid var(--ink);border-radius:0;
}
.sim-input:focus{outline:3px solid var(--hint,#b8860b);outline-offset:1px;}
.sim-go{
  padding:.5rem 1rem;font-weight:900;letter-spacing:.08em;cursor:pointer;
  background:var(--ink);color:var(--paper);border:2px solid var(--ink);
}
.sim-go:hover{background:var(--hint,#b8860b);color:#fff;}
.sim-body{flex:1;position:relative;min-height:0;background:#0a0a12;}
.sim-body canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.sim-code{
  position:absolute;inset:0;overflow:auto;margin:0;padding:.8rem;font-size:.68rem;
  background:#0a0a12;color:#cfc;white-space:pre-wrap;display:block;
}
.sim-foot{
  display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;
  background:var(--paper,#fdfbf2);border-top:3px solid var(--ink);flex-wrap:wrap;
}
.sim-hint{margin-left:auto;font-size:.6rem;color:var(--hint);letter-spacing:.06em;}
.html-body{flex:1;position:relative;min-height:0;background:#fff;display:flex;flex-direction:column;}
.html-body iframe{flex:1;min-height:0;border:0;width:100%;background:#fff;}
.html-code-wrap{margin:0;border-top:3px solid var(--ink);max-height:40%;overflow:auto;}
.html-code-wrap summary{padding:.5rem .75rem;cursor:pointer;font-weight:900;letter-spacing:.08em;font-size:.68rem;background:var(--ink);color:var(--paper);}
.html-code{white-space:pre;overflow:auto;margin:0;padding:.6rem .75rem;font-size:.68rem;background:#0a0a12;color:#cfc;max-height:210px;}

/* ---------- LIVE VISION MODE (NEO-BRUTALISM) ---------- */
.live-overlay{
  position:fixed;inset:0;z-index:4000;background:#FFFDF5;color:#000;
  display:flex;flex-direction:column;font-family:var(--font);
  border:8px solid #000;overflow:hidden;
}
.live-overlay[hidden]{display:none;}
.live-overlay:fullscreen{width:100vw;height:100vh;border-width:0;}
.live-top{
  display:flex;align-items:center;gap:.7rem;padding:.55rem .9rem;
  background:#FFD93D;border-bottom:6px solid #000;position:relative;z-index:2;
}
.live-title{
  font-weight:900;letter-spacing:.14em;font-size:.85rem;text-transform:uppercase;
  display:flex;align-items:center;gap:.5rem;white-space:nowrap;overflow:hidden;
}
.live-spin{display:inline-block;font-size:1.1rem;line-height:1;animation:liveSpin 8s linear infinite;}
.live-status{
  margin-left:auto;font-size:.66rem;font-weight:900;letter-spacing:.08em;white-space:nowrap;
  background:#000;color:#FFFDF5;padding:.4rem .75rem;text-transform:uppercase;
  box-shadow:4px 4px 0 0 #FF6B6B;animation:livePop .22s ease-out;
  display:flex;align-items:center;gap:.5rem;
}
.live-loader-slot{display:inline-flex;align-items:center;flex:none;line-height:0;}
.live-loader-slot:empty{display:none;}
.live-status.live-idle{box-shadow:4px 4px 0 0 #C4B5FD;}
.live-status.live-busy{box-shadow:4px 4px 0 0 #FFD93D;}
.live-top-btns{display:flex;gap:.5rem;align-items:center;}
.live-btn{
  border:3px solid #000;background:#FFFDF5;color:#000;cursor:pointer;
  font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:.66rem;
  padding:.45rem .85rem;box-shadow:4px 4px 0 0 #000;font-family:inherit;
  transition:transform .1s linear,box-shadow .1s linear,background .1s linear;
}
.live-btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 0 #000;}
.live-btn:active{transform:translate(3px,3px);box-shadow:none;}
.live-btn.live-btn-yellow{background:#FFD93D;}
.live-x{border:3px solid #000;background:#FF6B6B;color:#000;font-size:1rem;padding:.35rem .65rem;cursor:pointer;font-weight:900;font-family:inherit;box-shadow:4px 4px 0 0 #000;transition:transform .1s linear,box-shadow .1s linear;}
.live-x:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 0 #000;}
.live-x:active{transform:translate(3px,3px);box-shadow:none;}
.live-marquee{overflow:hidden;background:#000;color:#FFD93D;border-bottom:6px solid #000;padding:.28rem 0;white-space:nowrap;position:relative;z-index:1;}
.live-marquee-inner{display:inline-block;white-space:nowrap;animation:liveMarquee 24s linear infinite;}
.live-marquee-inner span{display:inline-block;padding:0 1.4rem;font-weight:900;letter-spacing:.18em;font-size:.68rem;text-transform:uppercase;}
.live-main{flex:1;min-height:0;display:flex;}
.live-cam-wrap{flex:1.25;position:relative;min-width:0;background:#000;border-right:6px solid #000;overflow:hidden;}
.live-cam-wrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scaleX(-1);}
.live-grid-overlay{position:absolute;inset:0;pointer-events:none;z-index:1;background-image:linear-gradient(to right,rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.07) 1px,transparent 1px);background-size:44px 44px;}
.live-live-badge{
  position:absolute;top:14px;left:14px;z-index:3;background:#FF6B6B;color:#000;
  border:3px solid #000;padding:.35rem .7rem;font-weight:900;letter-spacing:.14em;
  font-size:.68rem;text-transform:uppercase;box-shadow:4px 4px 0 0 #000;
  transform:rotate(-4deg);animation:liveBob 2.4s ease-in-out infinite;font-family:var(--font);
}
.live-cam-veil{
  position:absolute;inset:0;display:grid;place-items:center;z-index:2;background:#C4B5FD;
  color:#000;font-size:.8rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;
  text-align:center;padding:20px;border:6px dashed #000;
}
.live-cam-veil[hidden]{display:none;}
.live-chat{flex:1;min-width:0;display:flex;flex-direction:column;background:#FFFDF5;}
.live-convo{
  flex:1;min-height:0;overflow-y:auto;padding:.85rem .9rem;
  display:flex;flex-direction:column;gap:.7rem;
  background-image:radial-gradient(rgba(0,0,0,.16) 1.2px,transparent 1.2px);
  background-size:22px 22px;
}
.live-bubble{max-width:86%;padding:.55rem .75rem;font-size:.85rem;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;font-weight:500;animation:livePop .22s ease-out;}
.live-bubble.user{align-self:flex-end;background:#FF6B6B;border:3px solid #000;box-shadow:5px 5px 0 0 #000;transform:rotate(.5deg);}
.live-bubble.ai{align-self:flex-start;background:#FFFDF5;border:3px solid #000;box-shadow:5px 5px 0 0 #000;transform:rotate(-.6deg);}
.live-bubble .who{display:block;font-size:.6rem;letter-spacing:.16em;margin-bottom:3px;font-weight:900;text-transform:uppercase;}
.live-bubble.user .who{color:#fff;}
.live-input-row{display:flex;gap:.5rem;padding:.6rem .85rem;border-top:6px solid #000;background:#FFFDF5;}

/* ---- LIVE LOADERS (user-provided) ---- */
.live-loader.pulse{
  --uib-size:16px;--uib-color:#FFFDF5;--uib-speed:1s;--uib-stroke:2.5px;
  position:relative;display:flex;align-items:center;justify-content:flex-start;
  height:var(--uib-size);width:var(--uib-size);
}
.live-loader.pulse .line{
  position:absolute;top:0;left:calc(50% - var(--uib-stroke) / 2);display:flex;
  align-items:flex-start;height:100%;width:var(--uib-stroke);
}
.live-loader.pulse .line::before{
  content:'';height:22%;width:100%;border-radius:calc(var(--uib-stroke) / 2);
  background-color:var(--uib-color);animation:liveLdrPulse var(--uib-speed) ease-in-out infinite;
  transform-origin:center bottom;
}
.live-loader.pulse .line:nth-child(1){transform:rotate(calc(360deg / -12 * 1));}.live-loader.pulse .line:nth-child(1)::before{animation-delay:calc(var(--uib-speed) / -12 * 1);}
.live-loader.pulse .line:nth-child(2){transform:rotate(calc(360deg / -12 * 2));}.live-loader.pulse .line:nth-child(2)::before{animation-delay:calc(var(--uib-speed) / -12 * 2);}
.live-loader.pulse .line:nth-child(3){transform:rotate(calc(360deg / -12 * 3));}.live-loader.pulse .line:nth-child(3)::before{animation-delay:calc(var(--uib-speed) / -12 * 3);}
.live-loader.pulse .line:nth-child(4){transform:rotate(calc(360deg / -12 * 4));}.live-loader.pulse .line:nth-child(4)::before{animation-delay:calc(var(--uib-speed) / -12 * 4);}
.live-loader.pulse .line:nth-child(5){transform:rotate(calc(360deg / -12 * 5));}.live-loader.pulse .line:nth-child(5)::before{animation-delay:calc(var(--uib-speed) / -12 * 5);}
.live-loader.pulse .line:nth-child(6){transform:rotate(calc(360deg / -12 * 6));}.live-loader.pulse .line:nth-child(6)::before{animation-delay:calc(var(--uib-speed) / -12 * 6);}
.live-loader.pulse .line:nth-child(7){transform:rotate(calc(360deg / -12 * 7));}.live-loader.pulse .line:nth-child(7)::before{animation-delay:calc(var(--uib-speed) / -12 * 7);}
.live-loader.pulse .line:nth-child(8){transform:rotate(calc(360deg / -12 * 8));}.live-loader.pulse .line:nth-child(8)::before{animation-delay:calc(var(--uib-speed) / -12 * 8);}
.live-loader.pulse .line:nth-child(9){transform:rotate(calc(360deg / -12 * 9));}.live-loader.pulse .line:nth-child(9)::before{animation-delay:calc(var(--uib-speed) / -12 * 9);}
.live-loader.pulse .line:nth-child(10){transform:rotate(calc(360deg / -12 * 10));}.live-loader.pulse .line:nth-child(10)::before{animation-delay:calc(var(--uib-speed) / -12 * 10);}
.live-loader.pulse .line:nth-child(11){transform:rotate(calc(360deg / -12 * 11));}.live-loader.pulse .line:nth-child(11)::before{animation-delay:calc(var(--uib-speed) / -12 * 11);}
.live-loader.pulse .line:nth-child(12){transform:rotate(calc(360deg / -12 * 12));}.live-loader.pulse .line:nth-child(12)::before{animation-delay:calc(var(--uib-speed) / -12 * 12);}
@keyframes liveLdrPulse{0%,80%,100%{transform:scaleY(.75);opacity:0;}20%{transform:scaleY(1);opacity:1;}}
.live-loader.spin{
  --uib-size:16px;--uib-color:#FFFDF5;--uib-speed:.9s;--uib-stroke:2.5px;
  position:relative;display:flex;align-items:center;justify-content:center;
  height:var(--uib-size);width:var(--uib-size);
}
.live-loader.spin .line{
  position:absolute;top:calc(50% - var(--uib-stroke) / 2);left:0;height:var(--uib-stroke);
  width:100%;border-radius:calc(var(--uib-stroke) / 2);background-color:var(--uib-color);
  animation:liveLdrRotate var(--uib-speed) ease-in-out infinite alternate;
}
.live-loader.spin .line:nth-child(1){animation-delay:calc(var(--uib-speed) * -0.375);}
.live-loader.spin .line:nth-child(2){animation-delay:calc(var(--uib-speed) * -0.375);opacity:.8;}
.live-loader.spin .line:nth-child(3){animation-delay:calc(var(--uib-speed) * -0.3);opacity:.6;}
.live-loader.spin .line:nth-child(4){animation-delay:calc(var(--uib-speed) * -0.225);opacity:.4;}
.live-loader.spin .line:nth-child(5){animation-delay:calc(var(--uib-speed) * -0.15);opacity:.2;}
.live-loader.spin .line:nth-child(6){animation-delay:calc(var(--uib-speed) * -0.075);opacity:.1;}
@keyframes liveLdrRotate{0%{transform:rotate(0deg);}100%{transform:rotate(180deg);}}
.live-loader.dark.pulse{--uib-color:#000;}
.live-loader.dark.spin{--uib-color:#000;}
.live-bubble.think{align-self:flex-start;background:#FFD93D;border:3px solid #000;box-shadow:5px 5px 0 0 #000;display:flex;align-items:center;gap:.55rem;padding:.5rem .75rem;}

/* ---- LIVE CONTROL PANEL ---- */
.live-settings{
  position:absolute;top:calc(100% + 10px);right:8px;z-index:6;background:#FFFDF5;
  border:4px solid #000;box-shadow:7px 7px 0 0 #000;padding:12px 14px;min-width:230px;
  display:flex;flex-direction:column;gap:11px;animation:livePop .18s ease-out;font-family:var(--font);

.live-settings-title{font-weight:900;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;padding-bottom:7px;border-bottom:3px solid #000;display:flex;align-items:center;gap:.4rem;}
.live-set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.live-set-label{font-size:.6rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;}
.live-set-btn{border:3px solid #000;background:#FFD93D;color:#000;font-weight:900;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .55rem;cursor:pointer;font-family:inherit;box-shadow:3px 3px 0 0 #000;transition:transform .1s linear,box-shadow .1s linear,background .1s linear;}
.live-set-btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 0 #000;}
.live-set-btn:active{transform:translate(2px,2px);box-shadow:none;}
.live-set-btn.on{background:#FF6B6B;}
.live-set-row select{border:3px solid #000;background:#C4B5FD;color:#000;font-weight:900;font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;padding:.3rem .4rem;cursor:pointer;font-family:inherit;box-shadow:3px 3px 0 0 #000;}
.live-set-row select:focus{outline:none;}
